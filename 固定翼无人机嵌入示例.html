<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>固定翼无人机 · 嵌入示例</title><style>body{margin:0;padding:24px;background:#f2f4f0;color:#283832;font:14px 'Microsoft YaHei',sans-serif}h1{font-size:24px;font-weight:500}p{color:#718178;line-height:1.8}nav{display:flex;gap:12px;margin:22px 0;flex-wrap:wrap}button{border:1px solid #cbd3ca;background:#f9faf6;padding:10px 20px;border-radius:6px;cursor:pointer;color:#45594c}iframe{width:100%;height:760px;border:1px solid #d2d9d0;border-radius:12px}@media(max-width:560px){body{padding:12px}iframe{height:820px}}</style><h1>固定翼无人机 · 网页嵌入</h1><p>同一个离线文件可以嵌入你的网页。下方按钮通过父页面控制模型，所有三维显示均在浏览器内完成。</p><nav><button data-action="reset">整机总览</button><button data-action="explode" data-value="1">展开装配</button><button data-action="part" data-value="wing">主翼结构</button><button data-action="part" data-value="motor">电机剖视</button><button data-action="throttle" data-value="0.35">动力演示</button></nav><iframe id="aircraft" src="./固定翼无人机结构实验室.html?embed=1" title="固定翼无人机结构实验室" allow="fullscreen"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const m={type:'fixedwing',action:b.dataset.action};if(b.dataset.value)m.value=['explode','throttle'].includes(m.action)?Number(b.dataset.value):b.dataset.value;document.getElementById('aircraft').contentWindow.postMessage(m,'*');});</script></html>

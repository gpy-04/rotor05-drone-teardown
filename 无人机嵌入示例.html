<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>无人机 · 网页嵌入示例</title><style>*{box-sizing:border-box}body{margin:0;background:#e6eae3;color:#28372e;font:14px 'Microsoft YaHei',sans-serif}main{max-width:1520px;margin:0 auto;padding:38px 30px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.eyebrow{font:10px monospace;letter-spacing:3px;color:#8a6e52}h1{font-size:29px;letter-spacing:2px;font-weight:500;margin:10px 0 0}.tag{font-size:11px;color:#788777}.frame{border:1px solid #d4dcd0;border-radius:14px;overflow:hidden;background:#f4f5f2;box-shadow:0 15px 60px #243f2510}iframe{width:100%;height:780px;border:0;display:block}.tools{display:flex;gap:10px;align-items:center;padding:20px 0;flex-wrap:wrap}button{font:11px 'Microsoft YaHei';border:1px solid #bcc9b6;border-radius:5px;padding:9px 16px;color:#586b51;background:transparent;cursor:pointer}button:hover{background:#d6decf}.tools p{font-size:10px;color:#8a9785;margin-left:auto}footer{font-size:10px;color:#8e9989;margin-top:10px}@media(max-width:700px){main{padding:25px 14px}h1{font-size:22px}.tag{display:none}iframe{height:760px}.tools{gap:7px}.tools p{width:100%;margin-left:0}}
</style></head><body><main><header><div><div class="eyebrow">ROTOR / 05 — EMBED EXAMPLE</div><h1>从每颗螺钉，理解飞行。</h1></div><span class="tag">下方为插入当前页面的独立交互网页</span></header><div class="frame"><iframe id="drone" src="./无人机结构实验室.html?embed=1" title="无人机结构实验室 · 可交互精细模型" allow="fullscreen" loading="lazy"></iframe></div><div class="tools"><button data-action="reset">整机总览</button><button data-action="part" data-value="motor">电机内部</button><button data-action="part" data-value="fc">飞控特写</button><button data-action="explode" data-value="1">爆炸拆解</button><p>这些外部按钮通过 postMessage 与嵌入的模型通信。</p></div><footer>部署时，将本页面与「无人机结构实验室.html」置于同一目录。也可复制模型右上角「嵌入」中的代码到其他网站。</footer></main><script>document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>document.querySelector('iframe').contentWindow.postMessage({type:'rotor05',action:b.dataset.action,value:b.dataset.action==='explode'?Number(b.dataset.value):b.dataset.value},location.protocol==='file:'?'*':location.origin));</script></body></html>
